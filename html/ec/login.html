<script>
// Redirect old EC login links to main app with deep-link params
(function() {
  if (window.location.pathname.includes('/html/ec/login.html')) {
    const params = new URLSearchParams(window.location.search);
    const org = params.get('org');
    if (org) {
      const baseUrl = window.location.origin;
      window.location.replace(`${baseUrl}?role=ec&org=${encodeURIComponent(org)}`);
    }
  }
})();
</script>

          <p class="login-subtitle" data-i18n="ec_login_subtitle">Election Management Portal</p>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <select id="ecLoginLangSelect" class="input" style="max-width:110px;padding:6px 10px;font-size:13px" title="Change Language">
            <option value="ENG">🇬🇧 ENG</option>
            <option value="SPA">🇪🇸 SPA</option>
            <option value="FRE">🇫🇷 FRE</option>
            <option value="POR">🇵🇹 POR</option>
            <option value="TWI">🇬🇭 TWI</option>
          </select>
          <button id="ec-login-back" class="btn-back">
            <i class="fas fa-arrow-left"></i> <span data-i18n="back">Back</span>
          </button>
        </div>
      </div>

      <div class="login-body">
        <div class="form-grid">
          <div class="form-group">
            <label for="ec-org-id" data-i18n="organization_id">Organization ID</label>

            <input id="ec-pass" type="password" placeholder="Enter EC password" data-i18n-placeholder="ec_password_placeholder" autocomplete="off" />
          </div>

          <button id="ec-login-btn" class="btn btn-block neon-btn">

        <div class="info-banner">
