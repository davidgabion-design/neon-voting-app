  <!-- Global Error Handlers - Must load before any other scripts -->
  <script>
    // GLOBAL ERROR HANDLERS - Catches crashes on remote devices
    (function() {
      const APP_VERSION = 'v1.2.2-20260220'; // Cachebuster version
      window.NEON_APP_VERSION = APP_VERSION;
      
      // Store errors for debugging
      window.NEON_ERRORS = [];
      
      function logError(source, message, filename, lineno, colno, error) {
        const errorInfo = {
          timestamp: new Date().toISOString(),
          source: source,
          message: message,
          filename: filename || 'unknown',
          line: lineno || 0,
          column: colno || 0,
          stack: error?.stack || 'No stack trace',
          userAgent: navigator.userAgent
        };
        
        window.NEON_ERRORS.push(errorInfo);
        console.error(`[${source}] ${message}`, errorInfo);
        
        // Display error in UI
        showErrorInUI(errorInfo);
        
        return errorInfo;
      }
      
      function showErrorInUI(errorInfo) {
        // Create error container if doesn't exist
        let errorContainer = document.getElementById('neon-global-errors');
        if (!errorContainer) {
          errorContainer = document.createElement('div');
          errorContainer.id = 'neon-global-errors';
          errorContainer.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #d32f2f;
            color: white;
            padding: 16px;
            z-index: 999999;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
          `;
          document.body?.appendChild(errorContainer);
        }
        
        const errorBlock = document.createElement('div');
        errorBlock.style.cssText = 'margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 8px;';
        errorBlock.innerHTML = `
          <strong>[${errorInfo.source}]</strong> ${errorInfo.message}<br>
          <small>File: ${errorInfo.filename}:${errorInfo.line}:${errorInfo.column}</small><br>
          <small>Stack: ${errorInfo.stack.substring(0, 200)}...</small>
        `;
        
        errorContainer.appendChild(errorBlock);
      }
      
      // Catch synchronous errors
      window.onerror = function(message, filename, lineno, colno, error) {
        logError('window.onerror', message, filename, lineno, colno, error);
        return false; // Let default handler run too
      };
      
      // Catch unhandled promise rejections
      window.addEventListener('unhandledrejection', function(event) {
        const error = event.reason;
        logError(
          'unhandledrejection',
          error?.message || String(error),
          error?.fileName,
          error?.lineNumber,
          error?.columnNumber,
          error
        );
      });
      
      console.log(`✅ Global error handlers installed (${APP_VERSION})`);
    })();
  </script>

  <!-- Aggressive Cache Clearing for Version Updates -->
  <script>
    (async function() {
      const CURRENT_VERSION = 'v1.2.2-20260220';
      const STORED_VERSION = localStorage.getItem('NEON_LAST_VERSION');
      
      // If version changed or first load, aggressively clear ALL caches
      if (STORED_VERSION !== CURRENT_VERSION) {
        console.log(`🔄 Version change detected: ${STORED_VERSION || 'none'} → ${CURRENT_VERSION}`);
        console.log('🧹 Clearing ALL browser caches...');
        
        try {
          // Clear all Cache API caches
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map(name => caches.delete(name)));
          console.log(`✅ Deleted ${cacheNames.length} cache(s):`, cacheNames);
          
          // Update stored version
          localStorage.setItem('NEON_LAST_VERSION', CURRENT_VERSION);
          console.log('✅ Cache clearing complete');
        } catch (err) {
          console.warn('⚠️ Cache clearing failed:', err);
        }
      } else {
        console.log(`✅ Version unchanged (${CURRENT_VERSION}), using cached resources`);
      }
    })();
  </script>

                  console.log('🔗 Deep-link: SuperAdmin login');

                  console.log('🔗 Deep-link: Public results');

          loadingText.innerHTML = '<span style="color: #ff4444;">Error: ' + error.message + '</span><br><button onclick="location.reload()" style="margin-top:10px;padding:8px 16px;background:#9d00ff;color:white;border:none;border-radius:4px;cursor:pointer;">Reload</button>';
        }
      }
    }
    
    // Start initialization
    initializeApp();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      // Check for kill switch
      const disableSW = localStorage.getItem('NEON_DISABLE_SW') === '1';
      
      if (disableSW) {
        console.log('🔧 Service Worker disabled via kill switch (NEON_DISABLE_SW=1)');
        // Unregister all existing service workers
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let registration of registrations) {
            registration.unregister().then(() => {
              console.log('🔧 Service Worker unregistered due to kill switch');
            });
          }
        });
      } else {
        // Auto-unregister old service workers (cache busting)
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let registration of registrations) {
            registration.unregister().then(() => {
              console.log('🔧 Old Service Worker unregistered for cache refresh');
            });
          }
        });
        
        // Re-register with version parameter for cache busting
        window.addEventListener('load', () => {
          navigator.serviceWorker.register(`/sw.js?v=${window.NEON_APP_VERSION}`)
            .then((registration) => {
              console.log(`✅ Service Worker registered (${window.NEON_APP_VERSION}):`, registration.scope);
              
              // Check for updates periodically
              setInterval(() => {
                registration.update();
              }, 60000); // Check every minute
              
              // Listen for updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('✅ New app version available');
                    if (typeof window.showToast === 'function') {
                      window.showToast('App update available! Refresh to update.', 'info');
                    }
                  }
                });
              });
            })
            .catch((error) => {
              console.warn('⚠️ Service Worker registration failed:', error);
            });
        });
      }
    } else {
      console.warn('⚠️ Service Workers not supported in this browser');
    }
  </script>
