<script>
// Redirect old voter login links to main app with deep-link params
(function() {
  if (window.location.pathname.includes('/html/voter/login.html')) {
    const params = new URLSearchParams(window.location.search);
    const org = params.get('org');
    if (org) {
      const baseUrl = window.location.origin;
      window.location.replace(`${baseUrl}?role=voter&org=${encodeURIComponent(org)}`);
    }
  }
})();
</script>

        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <select id="voterLoginLangSelect" class="input" style="max-width:110px;padding:6px 10px;font-size:13px" title="Change Language">
            <option value="ENG">🇬🇧 ENG</option>
            <option value="SPA">🇪🇸 SPA</option>

            <option value="POR">🇵🇹 POR</option>
            <option value="TWI">🇬🇭 TWI</option>
          </select>
          <button id="voter-back" class="btn-back">

      <div class="login-body">
