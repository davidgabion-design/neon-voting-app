functionsDirectory = "C:\\Users\\RealTimeIT\\Desktop\\voting-app\\netlify\\functions"
functionsDirectoryOrigin = "config-v1"
headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[build]
publish = "C:\\Users\\RealTimeIT\\Desktop\\voting-app"
publishOrigin = "config"
functions = "C:\\Users\\RealTimeIT\\Desktop\\voting-app\\netlify\\functions"

  [build.environment]
  SECRETS_SCAN_ENABLED = "false"

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[functions]

  [functions."*"]
  node_bundler = "esbuild"

[[headers]]
for = "/*"

  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  X-XSS-Protection = "1; mode=block"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://*.firebaseio.com https://apis.google.com https://cdn.jsdelivr.net; connect-src 'self' data: blob: https://*.firebaseio.com https://*.googleapis.com https://firebasestorage.googleapis.com https://www.gstatic.com wss://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https: https://firebasestorage.googleapis.com; frame-src 'none'; object-src 'none'; frame-ancestors 'none';"
  Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
  Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

# PATCH START — Prevent JS caching to avoid stale code on voter devices
[[headers]]
for = "/*.js"

  [headers.values]
  Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"

[[headers]]
for = "/js/*.js"

  [headers.values]
  Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
# PATCH END

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200
force = true

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]